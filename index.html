<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de QR y Registro de Empleados</title>
    <!-- Librería para generar códigos QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 420px; text-align: center; box-sizing: border-box; }
        input, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; border-radius: 6px; border: 1px solid #ccc; font-size: 16px;}
        button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #0056b3; }
        #qrcode { display: flex; justify-content: center; margin-top: 20px; }
        .info-link { font-size: 11px; color: #666; word-break: break-all; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Registrar Nuevo Empleado</h2>
        <p>Genera su ID, QR y guárdalo en la planilla</p>
        
        <input type="text" id="nombreEmpleado" placeholder="Nombre y Apellido" required>
        <input type="email" id="emailEmpleado" placeholder="Correo electrónico" required>
        <input type="text" id="puestoEmpleado" placeholder="Puesto (Ej: Vendedor)" required>
        
        <button onclick="guardarYGenerarQR()">Guardar y Generar QR</button>

        <div style="margin-top: 15px; text-align: left;">
            <p><strong>ID Generado:</strong> <span id="txt-id" style="color: #007bff;">-</span></p>
        </div>

        <div id="qrcode"></div>
        <div id="url-generada" class="info-link"></div>
        <p id="estado-guardado" style="font-weight: bold; margin-top: 10px;"></p>
    </div>

    <script>
        // Recuerda reemplazar esta URL con la última que te proporcione Google Apps Script al hacer "Nueva versión"
        const URL_API = "https://script.google.com/macros/s/TU_URL_DE_DEPLOY_AQUI/exec";

        function guardarYGenerarQR() {
            const nombre = document.getElementById("nombreEmpleado").value.trim();
            const email = document.getElementById("emailEmpleado").value.trim();
            const puesto = document.getElementById("puestoEmpleado").value.trim();
            const estadoEl = document.getElementById("estado-guardado");

            if (!nombre || !email || !puesto) {
                alert("Por favor completa todos los campos.");
                return;
            }

            estadoEl.style.color = "#333";
            estadoEl.textContent = "Guardando en la planilla...";

            const iniciales = nombre.split(" ").map(n => n[0]).join("").toUpperCase();
            const aleatorio = Math.floor(1000 + Math.random() * 9000);
            const idProvisional = `${iniciales}-${aleatorio}`;

            const urlFinal = `${URL_API}?accion=nuevo_empleado&id_empleado=${encodeURIComponent(idProvisional)}&nombre=${encodeURIComponent(nombre)}&email=${encodeURIComponent(email)}&puesto=${encodeURIComponent(puesto)}`;

            // Usamos redirect: "follow" para interactuar de forma fluida con Google Apps Script
            fetch(urlFinal, {
                method: "GET",
                redirect: "follow"
            })
            .then(response => {
                estadoEl.style.color = "green";
                estadoEl.textContent = "¡Empleado guardado en la planilla con éxito!";
                
                document.getElementById("txt-id").textContent = idProvisional;

                const urlBaseApp = "https://cdominguezcofone-spec.github.io/control-asistencia-empresa/";
                const urlCompleta = `${urlBaseApp}?id=${idProvisional}`;

                document.getElementById("url-generada").textContent = "Enlace: " + urlCompleta;
                document.getElementById("qrcode").innerHTML = "";

                new QRCode(document.getElementById("qrcode"), {
                    text: urlCompleta,
                    width: 200,
                    height: 200
                });
            })
            .catch(error => {
                estadoEl.style.color = "red";
                estadoEl.textContent = "Error al conectar con la planilla.";
                console.error("Error:", error);
            });
        }
    </script>
</body>
</html>
